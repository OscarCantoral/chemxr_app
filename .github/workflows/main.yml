name: SonarCloud Analysis

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: "Project Key"
        required: true
        default: "OscarCantoral_chemxr_app"
      organization:
        description: "Organization Key"
        required: true
        default: "xxrandr"

permissions:
  contents: read

jobs:
  sonarcloud:
    name: Build and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      - name: Generate build timestamp
        id: timestamp
        run: echo "ts=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      # Compila la app, corre los tests unitarios y genera el reporte JaCoCo
      # requerido por el análisis de cobertura de SonarCloud.
      - name: Build, run unit tests and generate JaCoCo coverage
        run: ./gradlew --no-daemon assembleDebug createDebugUnitTestCoverageReport --stacktrace

      - name: SonarQube Scan
        uses: DevSecOps-Engineer-Org/reusable-workflows/actions/qa-sonar@v1.0.0
        with:
          app-name: chemxr-app
          project-key: ${{ github.event.inputs.project_key }}
          organization: ${{ github.event.inputs.organization }}
          tek: android
          build-timestamp: ${{ steps.timestamp.outputs.ts }}
          sonar-url: ${{ vars.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          coverage-path: app/build/reports/coverage/test/debug/report.xml

      - name: Print Quality Gate & Coverage Results
        if: always()
        run: |
          echo "=== SonarCloud Project Status ==="
          PROJECT_KEY="${{ github.event.inputs.project_key }}"
          curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${PROJECT_KEY}" \
            | jq -r '.projectStatus | "Status: " + .status, (.conditions[]? | "- " + .metricKey + ": " + (.actualValue|tostring) + " (threshold " + (.errorThreshold|tostring) + ") -> " + .status)'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
