name: CI

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: "Project Key"
        required: true
        default: "OscarCantoral_chemxr_app"
      organization:
        description: "Organization Key"
        required: true
        default: "oscarcantoral"

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare (Build, Test & Artifacts)
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.timestamp.outputs.ts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      - name: Generate build timestamp
        id: timestamp
        run: echo "ts=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      # Compila la app, corre los tests unitarios y genera el reporte KOVER
      # requerido por el analisis de cobertura de SonarCloud.
      - name: Build, run unit tests and generate Kover coverage
        run: ./gradlew --no-daemon assembleDebug koverXmlReport --stacktrace

      # Genera gradle.lockfile al vuelo (sin ensuciar el repo) para que Trivy
      # pueda auditar todas las dependencias directas y transitivas de Android/Maven.
      - name: Generate Gradle dependency lockfile for Trivy SCA
        run: |
          INIT_SCRIPT="$(mktemp --suffix=.gradle)"
          cat > "$INIT_SCRIPT" <<'EOF'
          allprojects {
            dependencyLocking {
              lockAllConfigurations()
            }
          }
          EOF
          ./gradlew --no-daemon dependencies --write-locks -I "$INIT_SCRIPT" >/dev/null
          rm -f "$INIT_SCRIPT"

      - name: Upload QA artifacts (classes, tests, coverage & lockfiles)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-artifacts-${{ github.run_id }}
          path: |
            **/gradle.lockfile
            app/build/reports/kover/
            app/build/test-results/
            app/build/intermediates/javac/debug/classes/
            app/build/tmp/kotlin-classes/debug/
            app/build/intermediates/classes/
          if-no-files-found: warn
          retention-days: 1

  gitleaks:
    name: Secrets Scan (Gitleaks)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Historia completa: gitleaks detect escanea todos los commits
          fetch-depth: 0

      - name: Gitleaks
        uses: DevSecOps-Engineer-Org/reusable-workflows/actions/qa-gitleaks@38723254af5ddb07039e983ce699b693f7f7eacb # v1.0.2
        with:
          fail-on-error: "true"

  trivy:
    name: Dependency & Security Scan (Trivy)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download QA artifacts (Gradle lockfile)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qa-artifacts-${{ github.run_id }}
          path: .

      - name: Trivy FS Scan
        uses: DevSecOps-Engineer-Org/reusable-workflows/actions/qa-trivy@38723254af5ddb07039e983ce699b693f7f7eacb # v1.0.2
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          fail-on-error: "true"

  sonarcloud:
    name: Code Quality & SAST (SonarCloud)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download QA artifacts (classes, tests & Kover coverage)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qa-artifacts-${{ github.run_id }}
          path: .

      - name: SonarQube Scan
        uses: DevSecOps-Engineer-Org/reusable-workflows/actions/qa-sonar@38723254af5ddb07039e983ce699b693f7f7eacb # v1.0.2
        with:
          app-name: chemxr-app
          project-key: ${{ github.event.inputs.project_key }}
          organization: ${{ github.event.inputs.organization }}
          tek: android
          build-timestamp: ${{ needs.prepare.outputs.ts }}
          sonar-url: ${{ vars.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          coverage-tool: kover
          coverage-path: app/build/reports/kover/report.xml

  cleanup:
    name: Cleanup QA Artifacts
    needs: [prepare, gitleaks, trivy, sonarcloud]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete temporary workflow artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="qa-artifacts-${RUN_ID}"
          IDS=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | .id" || true)
          if [ -z "$IDS" ]; then
            echo "No hay artefactos temporales pendientes por limpiar."
          else
            for id in $IDS; do
              gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}"
              echo "Artefacto temporal eliminado: ${ARTIFACT_NAME} (id=${id})"
            done
          fi
